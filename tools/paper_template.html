<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080c">
<title>Mandala-GNN — paper</title>
<link rel="stylesheet" href="paper.css">
<style>
  body { overflow: auto; padding: 0 0 60px; }
  .paper-top {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px;
    padding: 9px max(16px, calc((100vw - 1120px) / 2));
    background: rgba(7, 8, 12, .85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line-soft);
    font-size: 12px;
  }
  .paper-top a { color: var(--ink-dim); }
  .paper-top a:hover { color: var(--ink); }
  .paper-top .sp { margin-left: auto; }
  .paper { padding: 18px 16px 0; }
  .paper-sheet { max-width: 1040px; }
  @media (max-width: 780px) {
    .paper-sheet { padding: 22px 18px; }
    .paper-cols { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="paper-top">
  <a href="./">← Mandala-GNN</a>
  <span class="sp"></span>
  <a href="https://github.com/BoogerCheeseOnRye/mandala-gnn">Source ↗</a>
</div>
{{PAPER}}
</body>
</html>
